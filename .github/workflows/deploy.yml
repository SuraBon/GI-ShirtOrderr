name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL || vars.VITE_GAS_URL }}
          VITE_DASHBOARD_PASSCODE: ${{ secrets.VITE_DASHBOARD_PASSCODE || vars.VITE_DASHBOARD_PASSCODE }}
          VITE_GAS_ADMIN_TOKEN: ${{ secrets.VITE_GAS_ADMIN_TOKEN || vars.VITE_GAS_ADMIN_TOKEN }}
          VITE_DASHBOARD_SESSION_SECRET: ${{ secrets.VITE_DASHBOARD_SESSION_SECRET || vars.VITE_DASHBOARD_SESSION_SECRET }}
          DASHBOARD_PASSCODE: ${{ secrets.DASHBOARD_PASSCODE || vars.DASHBOARD_PASSCODE || secrets.VITE_DASHBOARD_PASSCODE || vars.VITE_DASHBOARD_PASSCODE }}
          GAS_ADMIN_TOKEN: ${{ secrets.GAS_ADMIN_TOKEN || vars.GAS_ADMIN_TOKEN || secrets.VITE_GAS_ADMIN_TOKEN || vars.VITE_GAS_ADMIN_TOKEN }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET || vars.DASHBOARD_SESSION_SECRET || secrets.VITE_DASHBOARD_SESSION_SECRET || vars.VITE_DASHBOARD_SESSION_SECRET }}
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
